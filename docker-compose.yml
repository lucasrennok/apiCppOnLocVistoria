services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sem "ports": o banco só é acessível pela rede interna do compose

  # --- Armazenamento de fotos (compatível com S3) ---
  # Opcional: só sobe com  docker compose --profile storage up
  # (o MinIO removeu suas imagens públicas; usamos o RustFS no lugar)
  storage:
    image: rustfs/rustfs:latest
    profiles: ["storage"]
    user: "0:0"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - storage_data:/data
    ports:
      - "9000:9000"   # API S3 (upload/download pelo navegador)
      - "9001:9001"   # console web

  storage-init:
    image: amazon/aws-cli:latest
    profiles: ["storage"]
    depends_on:
      - storage
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-onloc}
      S3_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./storage/init-bucket.sh:/init-bucket.sh:ro
    entrypoint: ["/bin/sh", "/init-bucket.sh"]

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -hex 32)}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-onloc}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    ports:
      - "${API_PORT}:${API_PORT}"

volumes:
  db_data:
  storage_data:
